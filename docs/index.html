<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuantBoard — Real-World LLM Leaderboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>QuantBoard</h1>
    <p>Real-world performance of quantized LLMs on personal hardware (Raspberry Pi, laptops, etc.)</p>
  </header>

  <main>
    <div class="controls">
      <button id="refresh">Refresh Data</button>
    </div>

    <div class="chart-container">
      <canvas id="perfChart"></canvas>
    </div>

    <table id="leaderboard">
      <thead>
        <tr>
          <th>
            Model
            <select id="filter-model">
              <option value="">All</option>
            </select>
          </th>
          <th>
            Params
            <select id="filter-params">
              <option value="">All</option>
            </select>
          </th>
          <th>
            Peak RAM (MB)
            <select id="filter-peak-ram">
              <option value="">All</option>
            </select>
          </th>
          <th>
            Speed (t/s)
            <select id="filter-speed">
              <option value="">All</option>
            </select>
          </th>
          <th>
            Size (MB)
            <select id="filter-size">
              <option value="">All</option>
            </select>
          </th>
          <th>
            PPL
            <select id="filter-ppl">
              <option value="">All</option>
            </select>
          </th>
          <th>
            Device
            <select id="filter-device">
              <option value="">All</option>
            </select>
          </th>
          <th>
            System RAM (GB)
            <select id="filter-ram">
              <option value="">All</option>
            </select>
          </th>
          <th>Date Checked</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Filled by JS -->
      </tbody>
    </table>
  </main>

  <footer>
    <p>Benchmarked with <a href="https://github.com/ggerganov/llama.cpp">llama.cpp</a> • 
       Source: <a href="https://github.com/yourname/quantboard">GitHub</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
